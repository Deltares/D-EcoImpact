# This workflow is used in bump_version and release workflows. It
# installs uv and updates the version of the code. It gives back
# the new version which can be used in the consequent workflows.

name: Version upgrade with uv

on:
  workflow_call:
    secrets:
      VERSION_DECOIMPACT:
        required: true
    inputs:
      release_type:
        required: true
        description: Choose type of release
        type: string
    outputs:
      project_version:
        value: ${{ jobs.upgrade-version.outputs.job_output_version}}

jobs:
  upgrade-version:
    runs-on: ubuntu-latest
    env:
      # check if the input is valid, if not set to empty string, if valid it will be used in the uv version command
      RELEASE_TYPE: ${{ (inputs.release_type == 'major' || inputs.release_type == 'minor' || inputs.release_type == 'patch') && inputs.release_type || '' }}
    outputs:
      job_output_version: ${{ steps.get-version.outputs.PROJECT_VERSION}}
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.VERSION_DECOIMPACT }}
          fetch-depth: 0
      - name: install python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.13.6
      - name: Validate RELEASE_TYPE
        run: |
          if ! [[ "$RELEASE_TYPE" =~ ^(major|minor|patch)$ ]]; then
            echo "Invalid RELEASE_TYPE: $RELEASE_TYPE" >&2
            exit 1
          fi
      - name: bump version and update template_input.yaml
        id: get-version
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          uv version --bump "$RELEASE_TYPE"
          PROJECT_VERSION=$(uv version --short)
          echo "PROJECT_VERSION=$PROJECT_VERSION" >> $GITHUB_OUTPUT
          sed -i "1 s/.*/version: $PROJECT_VERSION/" template_input.yaml
      - name: commit changes
        run: |
          PROJECT_VERSION=$(uv version --short)
          git add template_input.yaml
          git add pyproject.toml
          git commit -m "bump $RELEASE_TYPE version: ${{ steps.get-version.outputs.PROJECT_VERSION }}"
          git push
