# Bump a patch version with uv when a pull requst is merged

name: bump patch version using uv

on:
  pull_request_target:
    types:
      - closed
    branches:
      - main

jobs:
  bump-up-version:
    if: github.event.pull_request.merged == true
    secrets:
      VERSION_DECOIMPACT: ${{secrets.VERSION_DECOIMPACT}}
    uses: ./.github/workflows/version_upgrade.yml
    with:
      release_type: patch
