name: Create Mkdocs documentation

on:
  workflow_call:
    secrets:
      VERSION_DECOIMPACT:
        required: true
    inputs:
      project_version:
        required: true
        type: string

jobs:
  create-docs:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.project_version }}

    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.VERSION_DECOIMPACT }}
          fetch-depth: 0
      - name: install python
        uses: actions/setup-python@v4
        with:
          python-version: 3.14
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: 0.13.6
      - name: Install Dependencies
        run: uv sync
      - name: Create new version of mkdocs and publish
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          uv run mike deploy --push --update-aliases "$VERSION" latest
          uv run mike set-default --push latest
